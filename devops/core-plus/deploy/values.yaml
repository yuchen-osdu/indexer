# Default values for indexer-deploy.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  domain: ""
  # Host the HTTPRoute attaches to when httpRoute.hostnames is empty.
  hostname: ""
  limitsEnabled: true

# This flag enables configuration specific to ROSA environments.
rosa: false

data:
  # Configmap
  entitlementsHost: "http://entitlements"
  logLevel: "ERROR"
  partitionHost: "http://partition"
  schemaHost: "http://schema"
  securityHttpsCertificateTrust: "true"
  storageHost: "http://storage"
  # Otel
  javaToolOptions: "-XX:ActiveProcessorCount=8"
  otelExporterEndpoint: ""
  otelExporterProtocol: ""
  # PubSub topic configuration
  pubsubSearchTopicV2: "records-changed-v2"
  # Deployment
  requestsCpu: "35m"
  requestsMemory: "640Mi"
  limitsCpu: "1"
  limitsMemory: "1G"
  image: ""
  imagePullPolicy: "IfNotPresent"
  serviceAccountName: "indexer"
  # redis connection. Change it if you want to use external redis
  redisIndexerHost: ""
  redisIndexerPort: 6379
  redisImage: "docker.io/library/redis:7"

conf:
  appName: "indexer"
  configmap: "indexer-config"
  elasticSecretName: "indexer-elastic-secret"
  keycloakSecretName: "indexer-keycloak-secret"
  rabbitmqSecretName: "rabbitmq-secret"
  indexerRedisSecretName: "indexer-redis-secret"
  replicas: 1

httpRoute:
  enabled: false
  # Route name. Defaults to "<release>-route" so it never collides with a route of the same name
  # defined outside this chart.
  name: ""
  parentRefs:
    - name: cimpl-gateway
      namespace: istio-system
  # Defaults to global.hostname when empty. The render fails when both are empty.
  hostnames: []
  # One rule per entry. Optional per entry: pathType (default PathPrefix), serviceName
  # (default conf.appName), port (default 80) and filters (for example URLRewrite).
  routes:
    - path: /api/indexer/

istio:
  proxyCPU: "10m"
  proxyCPULimit: "200m"
  proxyMemory: "100Mi"
  proxyMemoryLimit: "256Mi"
  sidecarInject: true
